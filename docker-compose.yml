services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # data に書いた DB をホストのユーザーのまま編集できるよう、ホストの UID/GID で動かす。
    # bash の UID は上書きできないので HOST_UID / HOST_GID で渡す。1000 でないなら次のように起動する
    #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_SRC_DIR: /app/static
      DB_PATH: /app/data/kmp-activitypub.db
      # http で試すときは false にする。true のままだとログインできない
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # 先に作っておく。無いと Docker が root の持ち物として作り、書けなくなる
      - ./data:/app/data
#      - ./public:/public:ro
