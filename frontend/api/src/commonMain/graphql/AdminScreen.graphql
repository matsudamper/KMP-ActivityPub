query AdminAccess {
    userInfo {
        isAdmin
    }
}

subscription RemoteProfileRefresh($start: Boolean!) {
    remoteProfileRefresh(start: $start) {
        progress {
            running
            total
            refreshed
            failed
            skipped
            startedAt
            finishedAt
        }
    }
}

query FailedDeliveries($after: String, $limit: Int!) {
    userInfo {
        failedDeliveries(after: $after, limit: $limit) {
            deliveries {
                ...FailedDeliveryFields
            }
            nextCursor
        }
    }
}

query FailedDelivery($id: FailedDeliveryId!) {
    userInfo {
        failedDelivery(id: $id) {
            ...FailedDeliveryFields
        }
    }
}

fragment FailedDeliveryFields on FailedDelivery {
    id
    kind
    username
    inbox
    attempts
    enqueuedAt
    failedAt
    lastError
}
