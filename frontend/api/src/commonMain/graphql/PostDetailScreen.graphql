query PostDetailScreen($id: TimelinePostId!) {
    userInfo {
        timelinePost(id: $id) {
            ...TimelinePostFields
        }
    }
}

query QuoteTarget($postId: TimelinePostId!) {
    userInfo {
        quoteTarget(postId: $postId) {
            ...TimelinePostFields
        }
    }
}

query ReplyTarget($postId: TimelinePostId!) {
    userInfo {
        replyTarget(postId: $postId) {
            ...TimelinePostFields
        }
    }
}

query PostReplies($postId: TimelinePostId!) {
    userInfo {
        replies(postId: $postId) {
            ...TimelinePostFields
        }
    }
}

query PostRevisions($postId: TimelinePostId!) {
    userInfo {
        postRevisions(postId: $postId) {
            content
            mentions {
                start
                end
                acct
            }
            images {
                url
                thumbnailUrl
                description
            }
            emojis {
                name
                imageUrl
            }
            revisedAt
        }
    }
}

query PostCounts($postId: TimelinePostId!) {
    userInfo {
        postCounts(postId: $postId) {
            replyCount
            favouriteCount
            boostCount
        }
    }
}
