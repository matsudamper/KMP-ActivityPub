query HomeTimeline($cursor: String, $limit: Int!) {
    userInfo {
        homeTimeline(cursor: $cursor, limit: $limit) {
            posts {
                id
                content
                publishedAt
                username
                host
                displayName
                displayNameEmojis {
                    name
                    imageUrl
                }
                summary
                sensitive
                linkUrls
                iconUrl
                deletableNoteId
                images {
                    url
                    thumbnailUrl
                    description
                }
                emojis {
                    name
                    imageUrl
                }
                favouriteCount
                boostCount
                boostedBy {
                    username
                    host
                    displayName
                    displayNameEmojis {
                        name
                        imageUrl
                    }
                    iconUrl
                }
                stamps {
                    emoji
                    imageUrl
                    count
                }
                url
                likedByMe
                boostedByMe
                reactionPostId
                followingGroupId
            }
            nextCursor
        }
    }
}
