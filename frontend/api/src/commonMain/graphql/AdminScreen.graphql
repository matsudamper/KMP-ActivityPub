query AdminAccess {
    userInfo {
        isAdmin
    }
}

subscription RemoteProfileRefreshState {
    remoteProfileRefreshState {
        progress {
            running
            total
            refreshed
            failed
            skipped
            startedAt
            finishedAt
        }
    }
}

mutation StartRemoteProfileRefresh {
    user {
        startRemoteProfileRefresh {
            failure
        }
    }
}
