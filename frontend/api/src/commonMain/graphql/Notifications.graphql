query Notifications($after: String, $limit: Int!) {
    userInfo {
        notifications(after: $after, limit: $limit) {
            notifications {
                ...NotificationFields
            }
            nextCursor
        }
    }
}

fragment NotificationFields on NotificationGroup {
    id
    kind
    post {
        ...TimelinePostFields
    }
    recentActors {
        actor {
            ...ActorFields
        }
        reaction {
            emoji
            imageUrl
        }
    }
    actorCount
    updatedAt
}
