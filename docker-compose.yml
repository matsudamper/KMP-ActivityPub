services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_SRC_DIR: /app/static
      DB_PATH: /app/data/kmp-activitypub.db
    volumes:
      - data:/app/data
#      - ./public:/public:ro

volumes:
  data:
