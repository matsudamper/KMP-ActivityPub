services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # data の DB をホストのユーザーで編集できるようにする。UID/GID が 1000 でなければ
    #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_SRC_DIR: /app/static
      DB_PATH: /app/data/kmp-activitypub.db
      VALKEY_URI: redis://valkey:6379
      # http では false にする
      COOKIE_SECURE: "true"
      # 必須。true か false
      ENABLE_PASSKEY: "true"
      # ENABLE_PASSKEY が true なら必須。後から変えると登録済みのパスキーが使えなくなる
      PASSKEY_RP_ID: example.com
      # カンマ区切り。書かなければ https://<PASSKEY_RP_ID>
      # PASSKEY_ORIGINS: https://example.com
      # Android アプリでパスキーを使うとき。/.well-known/assetlinks.json を返し、アプリの origin を受け付ける
      # PASSKEY_ANDROID_PACKAGE_NAME: net.matsudamper.kmp.activitypub
      # アプリの署名証明書の SHA-256。カンマ区切り
      # PASSKEY_ANDROID_CERT_SHA256: "AA:BB:..."
      # 他のサーバーから @user@example.com で見つけてもらうためのドメイン
      DOMAIN: example.com
      # Cloudflare の後ろに置くとき。CF-Connecting-IP を接続元として使う。Cloudflare を通らずに届く経路があってはいけない
      # TRUST_CF_CONNECTING_IP: "true"
      # 必須。他のサーバーのプロフィール画像を中継する URL の署名鍵。署名の無い URL は中継しない。
      # 変えると中継 URL が全部変わり、Cloudflare のキャッシュに当たらなくなる
      #   openssl rand -base64 32
      REMOTE_ICON_PROXY_SECRET: change-me
      # 必須。true か false。true なら画像を S3 に置く。認証情報は、このサーバーを OIDC の IdP にして STS の AssumeRoleWithWebIdentity で受け取る
      ENABLE_S3: "false"
      # /.well-known/openid-configuration と /jwks を返す。パスを含めない。STS からこの URL に届くこと
      # OIDC_ISSUER: https://example.com
      # RSA 秘密鍵の JWK。./gradlew :backend:oidc:generateSigningJwk で作る
      # OIDC_JWK_PRIVATE: '{"kty":"RSA",...}'
      # S3_BUCKET: kmp-activitypub-images
      # S3_REGION: ap-northeast-1
      # IAM の OIDC プロバイダを信頼するロール
      # S3_ROLE_ARN: arn:aws:iam::123456789012:role/kmp-activitypub-image
      # IAM の OIDC プロバイダに登録した Audience
      # S3_AUDIENCE: kmp-activitypub
      # S3_ENDPOINT: https://s3.example.com
      # STS_ENDPOINT: https://sts.example.com
      # 既定は true
      # S3_PATH_STYLE_ACCESS: "true"
      # S3_ROLE_SESSION_NAME: kmp-activitypub-image-upload
      # OpenTelemetry の送り先。未設定だと localhost:4318 に送ろうとして失敗し続ける
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # OTEL_RESOURCE_ATTRIBUTES: service.name=kmp-activitypub,deployment.environment.name=production
      # 送らないとき
      # OTEL_SDK_DISABLED: "true"
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      # 起動前に作っておく。Docker に作らせると root の持ち物になる
      - ./data:/app/data
      # - ./public:/public:ro

  valkey:
    image: valkey/valkey:8
    # Append Only File が無いと再起動で全員ログアウトになる
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./valkey-data:/data
