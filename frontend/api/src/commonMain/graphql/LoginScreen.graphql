mutation UserLogin($query: UserLoginQuery!) {
    user {
        login(query: $query) {
            failure
        }
    }
}

mutation PasskeyLoginOptions {
    user {
        passkeyLoginOptions {
            challenge
            rpId
        }
    }
}

mutation PasskeyLogin($query: UserPasskeyLoginQuery!) {
    user {
        passkeyLogin(query: $query) {
            failure
        }
    }
}
