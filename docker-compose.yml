services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # data の DB をホストのユーザーで編集できるようにする。UID/GID が 1000 でなければ
    #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_SRC_DIR: /app/static
      DB_PATH: /app/data/kmp-activitypub.db
      # http では false にする
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # 無いと root の持ち物として作られ、書けなくなる
      - ./data:/app/data
#      - ./public:/public:ro
