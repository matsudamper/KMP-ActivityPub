mutation SetFollowing($actorUri: String!, $followed: Boolean!) {
    user {
        setFollowing(actorUri: $actorUri, followed: $followed)
    }
}

query FollowingUsers($after: String) {
    followingUsers(after: $after) {
        users {
            actorUri
            username
            host
            displayName
            iconUrl
        }
        nextCursor
    }
}
