mutation SetFollowing($actorUri: String!, $followed: Boolean!, $groupId: FollowingGroupId) {
    user {
        setFollowing(actorUri: $actorUri, followed: $followed, groupId: $groupId)
    }
}

query FollowingGroups {
    userInfo {
        id
        followingGroups {
            id
            name
        }
    }
}

mutation CreateFollowingGroup($name: String!) {
    user {
        createFollowingGroup(name: $name) {
            group {
                id
                name
            }
            failure
        }
    }
}

query FollowingUsers($after: String) {
    followingUsers(after: $after) {
        ...ActorListFields
    }
}

query FollowerUsers($after: String) {
    followerUsers(after: $after) {
        ...ActorListFields
    }
}

fragment ActorListFields on ActorList {
    users {
        actorUri
        following
        followingGroupId
        username
        host
        displayName
        iconUrl
    }
    nextCursor
}
