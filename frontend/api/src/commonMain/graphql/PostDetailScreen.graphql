query PostDetailScreen($id: ID!) {
    userInfo {
        post(id: $id) {
            id
            content
            publishedAt
            username
            host
            displayName
            summary
            sensitive
            linkUrls
            iconUrl
            deletableNoteId
            images {
                url
                description
            }
            favouriteCount
            stamps {
                emoji
                imageUrl
                count
            }
            likedByMe
        }
    }
}
