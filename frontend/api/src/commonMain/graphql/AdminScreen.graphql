query AdminAccess {
    userInfo {
        isAdmin
    }
}

query RemoteProfileRefreshProgress {
    userInfo {
        remoteProfileRefresh {
            running
            total
            refreshed
            failed
            skipped
            startedAt
            finishedAt
        }
    }
}

mutation StartRemoteProfileRefresh {
    user {
        startRemoteProfileRefresh {
            failure
        }
    }
}
