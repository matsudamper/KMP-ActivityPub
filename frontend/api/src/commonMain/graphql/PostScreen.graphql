mutation UserPostNote($body: String!, $requestId: String!, $contentWarning: String, $imageIds: [NoteImageId!]!, $replyToPostId: TimelinePostId, $quotePostId: TimelinePostId, $mentionAcct: String, $sensitive: Boolean!, $poll: PostNotePollInput) {
    user {
        postNote(body: $body, requestId: $requestId, contentWarning: $contentWarning, imageIds: $imageIds, replyToPostId: $replyToPostId, quotePostId: $quotePostId, mentionAcct: $mentionAcct, sensitive: $sensitive, poll: $poll) {
            url
            failure
        }
    }
}

mutation UploadNoteImage($image: Upload!, $description: String) {
    user {
        uploadNoteImage(image: $image, description: $description) {
            imageId
            failure
        }
    }
}
