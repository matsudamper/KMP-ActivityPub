services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # data の DB をホストのユーザーで編集できるようにする。UID/GID が 1000 でなければ
    #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_SRC_DIR: /app/static
      DB_PATH: /app/data/kmp-activitypub.db
      # http では false にする
      COOKIE_SECURE: "true"
      # 書かなければパスキーを使わない。RP ID は後から変えると登録済みのパスキーが使えなくなる
#      PASSKEY_RP_ID: example.com
      # カンマ区切り。書かなければ https://<PASSKEY_RP_ID>
#      PASSKEY_ORIGINS: https://example.com
      # Android アプリでパスキーを使うとき。/.well-known/assetlinks.json を返し、アプリの origin を受け付ける
#      PASSKEY_ANDROID_PACKAGE_NAME: net.matsudamper.kmp.activitypub
      # アプリの署名証明書の SHA-256。カンマ区切り
#      PASSKEY_ANDROID_CERT_SHA256: "AA:BB:..."
    volumes:
      # 起動前に作っておく。Docker に作らせると root の持ち物になる
      - ./data:/app/data
#      - ./public:/public:ro
