query MyProfile {
    profile {
        username
        displayName
        iconUrl
        summary
        links {
            name
            url
        }
        likesPublic
        followingCount
        followersCount
    }
}

mutation UpdateProfile($query: UpdateProfileQuery!) {
    user {
        updateProfile(query: $query) {
            failure
        }
    }
}

mutation UpdateProfileIcon($icon: String!) {
    user {
        updateProfileIcon(icon: $icon) {
            iconUrl
            failure
        }
    }
}
