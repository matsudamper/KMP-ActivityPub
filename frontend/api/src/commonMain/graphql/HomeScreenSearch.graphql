query HomeScreenSearchUsers($query: String!, $after: String) {
    searchUsers(query: $query, after: $after) {
        users {
            username
            host
            isLocal
            displayName
            displayNameEmojis {
                name
                imageUrl
            }
            iconUrl
            actorUri
            following
            followingGroupId
        }
        nextCursor
    }
}

query HomeScreenResolveUser($query: String!) {
    resolveUser(query: $query) {
        username
        host
        isLocal
        displayName
        displayNameEmojis {
            name
            imageUrl
        }
        iconUrl
        actorUri
        following
        followingGroupId
    }
}
