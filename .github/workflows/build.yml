name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ktlintCheck
        run: ./gradlew ktlintCheck

  detekt:
    name: detekt
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: detektCheck
        run: ./gradlew detektCheck

  backend:
    name: backend test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # build ではなく test にしているのは、build に付いてくる ktlintCheck が
      # ktlint ジョブと重複し、application プラグインの distZip / distTar も
      # 作られるため。配布は native-image なのでアーカイブは使わない
      - name: test
        run: ./gradlew test

  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Wasm バンドルのビルド
        run: ./gradlew :frontend:app-web:wasmJsBrowserDevelopmentExecutableDistribution

  android:
    name: build android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: APK のビルド
        run: ./gradlew :frontend:app-android:assembleDebug

      - name: frontend のテスト
        run: ./gradlew testFrontend

      - name: APK の名前にブランチとハッシュを付ける
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_REPO="${REPOSITORY##*/}"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          APK_DIR=frontend/app-android/build/outputs/apk/debug
          APK_NAME="app-${SAFE_REPO}-${SAFE_BRANCH}-${SHORT_SHA}.apk"
          mv "${APK_DIR}/app-android-debug.apk" "${APK_DIR}/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_PATH=${APK_DIR}/${APK_NAME}" >> "$GITHUB_ENV"

      - name: APK のアップロード
        id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          compression-level: 9

      - name: APK を S3 にアップロード
        id: upload_s3
        uses: matsudamper/actions/upload-matsudamper-s3@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        continue-on-error: true
        with:
          file_path: ${{ env.APK_PATH }}

      - name: QR コードのアップロード
        if: github.event_name == 'pull_request'
        id: qr_artifact
        uses: matsudamper/actions/upload-qr-code@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        with:
          url: ${{ steps.upload_apk.outputs.artifact-url }}
          output_path: qrcode-github.png
          artifact_name: apk-qr-code-github

      - name: S3 の QR コードのアップロード
        if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
        id: s3_qr_artifact
        uses: matsudamper/actions/upload-qr-code@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        with:
          url: ${{ steps.upload_s3.outputs.url }}
          output_path: qrcode-s3.png
          artifact_name: apk-qr-code-s3

      # フォークと Dependabot の PR では GITHUB_TOKEN が読み取り専用で、コメントを書けない
      - name: APK のダウンロード URL をコメント
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: apk-download
          recreate: true
          message: |
            ✅ Debug APK is ready!

            | Storage | Download Link | QR Code |
            | :--- | :--- | :--- |
            | 🐙 GitHub Artifacts | [Download](${{ steps.upload_apk.outputs.artifact-url }}) | [View](${{ steps.qr_artifact.outputs.artifact-url }}) |
            ${{ steps.upload_s3.outputs.url && format('| ☁️ S3 | [Download]({0}) | [View]({1}) |', steps.upload_s3.outputs.url, steps.s3_qr_artifact.outputs.artifact-url) || '' }}

            ---
            *Artifact Name: `${{ env.APK_NAME }}`*

  native-test:
    name: native backend test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # JCA が native-image 上で動くかは JVM のテストでは分からないので、
      # テストごと native バイナリにして実行する
      - name: crypto の native テスト
        run: ./gradlew :backend:crypto:nativeTest

  native-image:
    name: native-image build
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GraalVM のセットアップ
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: native-image ビルド
        run: ./gradlew :backend:nativeCompile

      - name: 起動確認
        run: |
          set -euo pipefail

          # 起動時のスキーマ自動適用は無い（実運用では sqlite3def で手適用する）
          export DB_PATH="$RUNNER_TEMP/native-check/kmp-activitypub.db"
          mkdir -p "$(dirname "$DB_PATH")"
          sqlite3 "$DB_PATH" < backend/repository/src/main/resources/db/schema.sql

          export VALKEY_URI=redis://localhost:6379
          export ADMIN_PASSWORD_HASH='pbkdf2-sha256:210000:HP9l044PxKN0LJhMy5GyrQ:tWTwqvZDQgC75D39BMPPm2TvA3F9S3bUP1-XyH5l4HQ'
          # http で叩くので、Secure を付けると Cookie の確認ができない
          export COOKIE_SECURE=false
          export DOMAIN=example.com

          ./backend/build/native/nativeCompile/kmp-activitypub > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz -o /tmp/response.txt; then
              break
            fi
            sleep 1
          done

          if ! grep -q '"status":"ok"' /tmp/response.txt 2>/dev/null; then
            echo "::error::サーバーの起動確認に失敗しました"
            cat /tmp/server.log
            exit 1
          fi

          gql() {
            curl -sf -X POST -H 'Content-Type: application/json' "$@" http://localhost:8080/graphql
          }

          # graphql-java が native-image で動くか、スキーマが同梱されているかは
          # JVM のテストでは分からない
          echo "--- 管理画面のログイン ---"
          gql -D /tmp/admin-login-headers.txt \
            -d '{"query":"mutation Login($password: String!) { admin { login(password: $password) { session { loggedIn } failure } } }","variables":{"password":"ci-password"}}' \
            -o /tmp/admin-login.json
          cat /tmp/admin-login.json
          grep -q '"loggedIn":true' /tmp/admin-login.json
          ADMIN_COOKIE="$(grep -io 'admin_session=[^;]*' /tmp/admin-login-headers.txt | head -n 1)"

          # input object は kickstart が Jackson で組み立てる。native-image で落ちると errors になる
          echo "--- ユーザーの登録 ---"
          gql -H "Cookie: $ADMIN_COOKIE" \
            -d '{"query":"mutation Add($query: AddUserQuery!) { admin { addUser(query: $query) { adminAccount { acct createdAt } failure { isDuplicated } } } }","variables":{"query":{"username":"ci-user","password":"ci-user-password"}}}' \
            -o /tmp/add-user.json
          cat /tmp/add-user.json
          grep -q '"acct":"@ci-user@example.com"' /tmp/add-user.json

          # WebFinger と Actor は @SerialName とカスタム serializer を通る
          echo "--- WebFinger ---"
          curl -sf "http://localhost:8080/.well-known/webfinger?resource=acct:ci-user@example.com" -o /tmp/webfinger.json
          cat /tmp/webfinger.json
          grep -q '"subject":"acct:ci-user@example.com"' /tmp/webfinger.json

          echo "--- Actor ---"
          curl -sf -H 'Accept: application/activity+json' http://localhost:8080/users/ci-user -o /tmp/actor.json
          cat /tmp/actor.json
          grep -q 'BEGIN PUBLIC KEY' /tmp/actor.json

          echo "--- inbox は署名が無ければ 401 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/activity+json' \
            -d '{"type":"Follow"}' \
            "http://localhost:8080/users/ci-user/inbox")" = "401"

          echo "--- ユーザーのログイン ---"
          gql -D /tmp/user-login-headers.txt \
            -d '{"query":"mutation Login($query: UserLoginQuery!) { user { login(query: $query) { failure } } }","variables":{"query":{"username":"ci-user","password":"ci-user-password"}}}' \
            -o /tmp/user-login.json
          cat /tmp/user-login.json
          grep -q '"failure":null' /tmp/user-login.json
          USER_COOKIE="$(grep -io 'user_session=[^;]*' /tmp/user-login-headers.txt | head -n 1)"

          echo "--- 投稿 ---"
          gql -H "Cookie: $USER_COOKIE" \
            -d '{"query":"mutation Post($body: String!) { user { postNote(body: $body) { note { id url } failure { isEmpty } } } }","variables":{"body":"ci"}}' \
            -o /tmp/post-note.json
          cat /tmp/post-note.json
          grep -q '"failure":null' /tmp/post-note.json

          NOTE_URL="$(python3 -c "import json; print(json.load(open('/tmp/post-note.json'))['data']['user']['postNote']['note']['url'])")"
          NOTE_PATH="/${NOTE_URL#https://example.com/}"
          echo "--- Note ---"
          curl -sf -H 'Accept: application/activity+json' "http://localhost:8080$NOTE_PATH" -o /tmp/note.json
          cat /tmp/note.json
          grep -q '"type":"Note"' /tmp/note.json

          echo "--- ログインしていなければ投稿できない ---"
          gql -d '{"query":"mutation { user { postNote(body: \"ci\") { failure { isEmpty } } } }"}' -o /tmp/post-anon.json
          grep -q '"errors"' /tmp/post-anon.json

  build-all-success:
    name: build-all-success
    needs: [ktlint, detekt, backend, frontend, android, native-test, native-image]
    # needs のジョブが落ちるとこのジョブ自体が skipped になり、必須チェックとしては通ってしまう。
    # 常に動かして needs の結果を見る
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
