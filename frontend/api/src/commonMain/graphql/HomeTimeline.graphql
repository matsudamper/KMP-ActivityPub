query HomeTimeline($cursor: String, $limit: Int!) {
    userInfo {
        homeTimeline(cursor: $cursor, limit: $limit) {
            posts {
                id
                content
                publishedAt
                username
                host
                displayName
                summary
                sensitive
                linkUrls
                iconUrl
                deletableNoteId
                images {
                    url
                    description
                }
                favouriteCount
                boostCount
                boostedBy {
                    username
                    host
                    displayName
                }
                stamps {
                    emoji
                    imageUrl
                    count
                }
            }
            nextCursor
        }
    }
}
