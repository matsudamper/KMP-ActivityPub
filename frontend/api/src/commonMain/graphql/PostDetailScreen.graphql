query PostDetailScreen($id: TimelinePostId!) {
    userInfo {
        timelinePost(id: $id) {
            ...TimelinePostFields
        }
    }
}

query QuoteTarget($postId: TimelinePostId!) {
    userInfo {
        quoteTarget(postId: $postId) {
            ...TimelinePostFields
        }
    }
}

query ReplyTarget($postId: TimelinePostId!) {
    userInfo {
        replyTarget(postId: $postId) {
            ...TimelinePostFields
        }
    }
}

query PostReplies($postId: TimelinePostId!) {
    userInfo {
        replies(postId: $postId) {
            ...TimelinePostFields
        }
    }
}

query PostRevisions($postId: TimelinePostId!, $after: String, $limit: Int!) {
    userInfo {
        postRevisions(postId: $postId, after: $after, limit: $limit) {
            revisions {
                id
                content
                sensitive
                mentions {
                    start
                    end
                    acct
                }
                images {
                    url
                    thumbnailUrl
                    description
                }
                emojis {
                    name
                    imageUrl
                }
                revisedAt
            }
            nextCursor
        }
    }
}

query PostCounts($postId: TimelinePostId!) {
    userInfo {
        postCounts(postId: $postId) {
            replyCount
            favouriteCount
            boostCount
        }
    }
}
