mutation UserLogin($query: UserLoginQuery!) {
    user {
        login(query: $query) {
            failure
        }
    }
}

mutation PasskeyLoginOptions {
    user {
        passkeyLoginOptions
    }
}

mutation PasskeyLogin($credential: String!) {
    user {
        passkeyLogin(credential: $credential) {
            failure
        }
    }
}
