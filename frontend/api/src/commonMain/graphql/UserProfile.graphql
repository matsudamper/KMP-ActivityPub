query UserProfile($username: String!) {
    userProfile(acct: $username) {
        user {
            actorUri
            username
            host
            displayName
            displayNameEmojis {
                name
                imageUrl
            }
            iconUrl
            following
            followingGroupId
        }
        headerUrl
        biography
        viewerIsOwner
        links {
            name
            url
        }
        posts {
            ...ProfilePostFields
        }
        postsNextCursor
    }
}

query UserProfilePosts($after: String!) {
    userProfilePosts(after: $after) {
        posts {
            ...ProfilePostFields
        }
        nextCursor
    }
}

fragment ProfilePostFields on ProfilePost {
    content
    publishedAt
    summary
    sensitive
    linkPreviewId
    postId
    deletableNoteId
    pinned
    pinnableNoteId
    linkUrls
    images {
        url
        thumbnailUrl
        description
    }
    emojis {
        name
        imageUrl
    }
    favouriteCount
    boostCount
    stamps {
        emoji
        imageUrl
        count
    }
    like {
        postId
        likedByMe
    }
    boostedByMe
    reactionPostId
    url
    boostedNoteAuthor {
        username
        host
        displayName
        displayNameEmojis {
            name
            imageUrl
        }
        iconUrl
    }
}
