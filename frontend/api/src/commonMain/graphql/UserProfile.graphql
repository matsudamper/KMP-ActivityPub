query UserProfile($username: String!) {
    userProfile(acct: $username) {
        user {
            actorUri
            username
            host
            displayName
            iconUrl
            following
        }
        biography
        links {
            name
            url
        }
        posts {
            content
            publishedAt
            summary
            sensitive
            linkPreviewId
            linkUrls
            images {
                url
                description
            }
            favouriteCount
            stamps {
                emoji
                imageUrl
                count
            }
        }
    }
}
