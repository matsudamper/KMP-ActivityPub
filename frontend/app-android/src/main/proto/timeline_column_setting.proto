syntax = "proto3";

option java_package = "net.matsudamper.kmp.activitypub.android.timeline";
option java_multiple_files = true;

message TimelineColumnSettingProto {
  // 購読先を 1 つずつ選んでいた頃の形。読めないので既定のカラムに戻す
  reserved 1, 2;
  // 一度も保存していないときと、全部消したときを分けるため
  bool saved = 3;
  repeated TimelineColumnProto columns = 4;
}

message TimelineColumnProto {
  string id = 1;
  string name = 2;
  bool home = 3;
  repeated string following_group_ids = 4;
}
