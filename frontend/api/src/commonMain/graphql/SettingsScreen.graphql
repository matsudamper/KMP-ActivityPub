query SettingsScreenPasskeys {
    passkeys {
        id
        name
    }
}

mutation PasskeyRegistrationOptions {
    user {
        passkeyRegistrationOptions
    }
}

mutation RegisterPasskey($query: RegisterPasskeyQuery!) {
    user {
        registerPasskey(query: $query) {
            failure
        }
    }
}

mutation DeletePasskey($id: PasskeyCredentialId!) {
    user {
        deletePasskey(id: $id) {
            failure
        }
    }
}
