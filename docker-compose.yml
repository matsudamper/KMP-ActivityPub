services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # data に書いた DB をホストのユーザーのまま編集できるよう、ホストの UID/GID で動かす
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_SRC_DIR: /app/static
      DB_PATH: /app/data/kmp-activitypub.db
    volumes:
      - ./data:/app/data
#      - ./public:/public:ro
