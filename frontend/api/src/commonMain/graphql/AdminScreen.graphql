query AdminAccess {
    userInfo {
        isAdmin
    }
}

subscription RemoteProfileRefresh($start: Boolean!) {
    remoteProfileRefresh(start: $start) {
        progress {
            running
            total
            refreshed
            failed
            skipped
            startedAt
            finishedAt
        }
    }
}

query FailedDeliveries($after: String, $limit: Int!) {
    userInfo {
        failedDeliveries(after: $after, limit: $limit) {
            deliveries {
                ...FailedDeliveryFields
            }
            nextCursor
        }
    }
}

query FailedDelivery($id: FailedDeliveryId!) {
    userInfo {
        failedDelivery(id: $id) {
            ...FailedDeliveryFields
        }
    }
}

fragment FailedDeliveryFields on FailedDelivery {
    id
    kind
    username
    inbox
    attempts
    enqueuedAt
    failedAt
    lastError
}

query UnknownObjectTypes($after: String, $limit: Int!) {
    userInfo {
        unknownObjectTypes(after: $after, limit: $limit) {
            types {
                typeName
                sourceUrl
                seenCount
                firstSeenAt
                lastSeenAt
            }
            nextCursor
        }
    }
}

query DeliveryTargetLimit {
    userInfo {
        deliveryTargetLimit {
            maxPerHost
            hosts {
                host
                deliveryTargetCount
            }
        }
    }
}

query DeletedRemoteNotes($after: String, $limit: Int!) {
    userInfo {
        deletedRemoteNotes(after: $after, limit: $limit) {
            notes {
                id
                objectUri
                actorUri
                actorName
                contentText
                publishedAt
                deletedAt
            }
            nextCursor
        }
    }
}

mutation PurgeDeletedRemoteNote($id: DeletedRemoteNoteId!) {
    user {
        purgeDeletedRemoteNote(id: $id) {
            failure
        }
    }
}

mutation PurgeAllDeletedRemoteNotes {
    user {
        purgeAllDeletedRemoteNotes {
            purgedCount
            failure
        }
    }
}
